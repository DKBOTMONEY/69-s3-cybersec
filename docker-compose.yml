version: '3.8'

services:
  db:
    container_name: 69-s3-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patipan     # เปลี่ยนตามที่คุณใช้งานจริง
      POSTGRES_PASSWORD: patipan  # เปลี่ยนตามที่คุณใช้งานจริง
      POSTGRES_DB: my_database       # เปลี่ยนตามที่คุณใช้งานจริง
    ports:
      - "54327:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    container_name: 69-s3-admin
    image: dpage/pgadmin4            # Image ที่ถูกต้องสำหรับ pgAdmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com  # อีเมลสำหรับ Login เข้า pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin         # รหัสผ่านสำหรับ Login
    ports:
      - "8080:80"                    # Map พอร์ต 80 ของ pgAdmin ออกมาที่ 8080
    depends_on:
      - db

volumes:
  pgdata:
