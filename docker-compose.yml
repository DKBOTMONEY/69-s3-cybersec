services:
  db:
    container_name: 69-s3-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:54327:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    container_name: 69-s3-admin
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - db

  # --- เพิ่ม Service ของ App (Strapi) ---
  my_app:
    container_name: my_app
    image: prawee/strapi
    restart: unless-stopped
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=db           # ชี้ไปยังชื่อ service 'db' ด้านบน
      - DATABASE_PORT=5432         # ใช้พอร์ตภายในของ Container
      - DATABASE_NAME=${DB_NAME}   # ดึงค่าจาก .env
      - DATABASE_USERNAME=${DB_USER} # ดึงค่าจาก .env
      - DATABASE_PASSWORD=${DB_PASSWORD} # ดึงค่าจาก .env
    ports:
      - "127.0.0.1:8083:1337"
    depends_on:
      - db                         # รอให้ db สตาร์ทก่อน

volumes:
  pgdata: